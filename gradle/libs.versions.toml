[versions]
kotlin = "2.1.10"
android_gradle_version = "8.13.2"
compose_bom = "2025.02.00"
compose_nav = "2.8.8"
lifecycle = "2.8.7"
activity = "1.10.1"
appcompat = "1.7.0"
corektx = "1.15.0"
jUnit = "4.13.2"
jUnitExt = "1.2.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
hilt = "2.55"
hilt_nav_compose = "1.2.0"
ksp = "2.1.10-1.0.29"
coil = "2.7.0"
ktlint = "12.1.2"
coroutines = "1.10.1"
maplibre = "11.8.0"
lifecycle_runtime_compose = "2.8.7"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose_bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "compose_nav" }
compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle_runtime_compose" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "corektx" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt_nav_compose" }

jUnit = { group = "junit", name = "junit", version.ref = "jUnit" }
jUnitExt = { group = "androidx.test.ext", name = "junit", version.ref = "jUnitExt" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

[bundles]
compose = [
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-material-icons",
    "compose-navigation",
    "compose-viewmodel",
    "lifecycle-runtime-compose",
    "compose-activity",
    "coil",
]
network = ["retrofit", "gson", "okhttp", "okhttp-logging"]
testing = ["jUnit", "jUnitExt"]

[plugins]
android-application = { id = "com.android.application", version.ref = "android_gradle_version" }
android-library = { id = "com.android.library", version.ref = "android_gradle_version" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
